<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘 최저가">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>오늘 최저가</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1d2320;--sub:#5d6761;--mute:#98a29c;--line:#e3e6e1;--green:#2f7d4f;--greenbg:#e6f3ea;--amber:#b8791a;--amberbg:#fdf2dc;--accent:#2f7d4f}
@media(prefers-color-scheme:dark){:root{--bg:#141815;--card:#1d2420;--ink:#eef2ee;--sub:#a8b2ab;--mute:#6f7a73;--line:#2b342f;--green:#6fcf97;--greenbg:#1d3326;--amber:#e0a94a;--amberbg:#352b17;--accent:#6fcf97}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans KR","Noto Sans JP","Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom))}
main{max-width:600px;margin:0 auto;padding:14px 14px 0}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:20px;margin:0;font-weight:700}
.date{font-size:14px;color:var(--sub)}
.ver{font-size:11px;font-weight:500;color:var(--mute);margin-left:4px;vertical-align:2px}
.sub{font-size:12px;color:var(--mute);margin:3px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;font-size:15px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;font-family:inherit}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
@media(prefers-color-scheme:dark){.tab.on{color:#10201a}}
.banner{background:var(--amberbg);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.schips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.schip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.schip .n{font-size:14px;font-weight:700}
.schip .c{font-size:12px;color:var(--sub)}
.schip.on{border-color:var(--accent);background:var(--greenbg)}
.shop-head{margin:2px 0 10px}
.shop-head h2{font-size:17px;margin:0}
.shop-head .meta{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.5}
.sec-title{font-size:13px;font-weight:700;color:var(--sub);margin:16px 2px 8px}
.leaflets{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.lf{flex:0 0 78%;max-width:340px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;padding:0;font-family:inherit;color:var(--ink);text-align:left}
.lf img{display:block;width:100%;height:auto;background:#ddd}
.lf .t{padding:8px 10px;font-size:12px;line-height:1.4}
.lf .t b{display:block;font-size:13px}
.lf .t span{color:var(--mute)}
.hint{font-size:11px;color:var(--mute);margin:2px 2px 0}
.group-title{font-size:13px;font-weight:700;margin:16px 2px 6px;display:flex;justify-content:space-between}
.group-title span{color:var(--mute);font-weight:400}
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.row:first-child{border-top:0}
.row.past{opacity:.5}
.rname{color:var(--sub);line-height:1.4}
.rname b{color:var(--ink);font-weight:600}
.rnote{font-size:11px;color:var(--mute);grid-column:1/2;line-height:1.4}
.rprice{text-align:right;font-size:14px;font-weight:600;white-space:nowrap}
.rper{font-size:12px;color:var(--sub);text-align:right;white-space:nowrap}
.rper.noprice{color:var(--mute)}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;background:var(--bg);color:var(--sub);margin-right:4px;vertical-align:1px}
.tag.today{background:var(--greenbg);color:var(--green)}
.row.best-row .rper{color:var(--green);font-weight:700}
.row.best-row .rprice{color:var(--green)}
.gname{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.star{background:none;border:0;font-size:22px;line-height:1;padding:2px 4px;cursor:pointer;color:var(--mute);font-family:inherit}
.star.on{color:#e5a812}
.best{font-size:12px;font-weight:700;color:var(--green);background:var(--greenbg);padding:3px 9px;border-radius:99px;white-space:nowrap}
.best.nb{color:var(--mute);background:var(--bg);font-weight:500}
.card .rows{border:0;padding:0;margin-top:8px;background:none}
.fav-tag{font-size:11px;color:var(--mute)}
.empty{text-align:center;color:var(--sub);padding:34px 10px;font-size:14px;line-height:1.7}
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap input{width:100%;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;outline:none}
.searchwrap input:focus{border-color:var(--accent)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:10;overflow:hidden}
.sugg button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;font-size:15px;color:var(--ink);font-family:inherit;cursor:pointer}
.sugg button:first-child{border-top:0}
.sugg button:active,.sugg button.hl{background:var(--greenbg)}
.sugg .deal{font-size:12px;color:var(--green);font-weight:600;white-space:nowrap}
.sugg .nodeal{font-size:12px;color:var(--mute);white-space:nowrap}
.sugg .noresult{padding:12px 14px;font-size:13px;color:var(--mute)}
.ko{font-weight:700}
.jp{font-weight:400;color:var(--sub);font-size:.82em;margin-left:4px}
.week-box{background:var(--greenbg);color:var(--green);border-radius:10px;padding:9px 12px;font-size:13px;margin:12px 0 4px;line-height:1.5}
.week-box b{font-weight:700}
.foot{font-size:11px;color:var(--mute);text-align:center;margin-top:18px;line-height:1.6}
/* viewer */
#viewer{position:fixed;inset:0;background:#fff;z-index:100;display:none;flex-direction:column;touch-action:manipulation}
#viewer.on{display:flex}
.vbar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;color:#1d2320;font-size:13px;border-bottom:1px solid #e3e6e1}
.vbar .vt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar button{display:flex;align-items:center;justify-content:center;padding:0;background:#0000000f;border:0;color:#1d2320;font-size:15px;width:40px;height:40px;border-radius:10px;font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#vscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;background:#fff}
#vscroll img{display:block;width:100%;height:auto;max-width:none;background:#fff}
.vnav{display:flex;justify-content:space-between;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #e3e6e1;background:#fff}
.vnav button{flex:1;background:#0000000f;border:0;color:#1d2320;height:44px;border-radius:10px;font-size:14px;font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.vnav button[disabled]{opacity:.3}
.fchips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.fchip{flex:0 0 auto;font-size:13px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;font-family:inherit;white-space:nowrap}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
@media(prefers-color-scheme:dark){.fchip.on{color:#10201a}}
.fchip .c{opacity:.8;margin-left:3px}
.fnote{font-size:12px;color:var(--mute);margin:2px 2px 10px;line-height:1.5}
button,a{touch-action:manipulation}
</style>
</head>
<body>
<main>
  <header><h1>오늘의 최저가 <span class="ver" id="ver"></span></h1><span class="date" id="today"></span></header>
  <div class="sub" id="sub"></div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="store">가게별</button>
    <button class="tab" data-t="fav">즐겨찾기</button>
  </div>
  <div class="fchips" id="fchips" style="display:none"></div>
  <div class="searchwrap" id="search" style="display:none">
    <input id="addi" type="search" placeholder="품목 검색 (예: 우유, 닭다리살)" autocomplete="off" autocapitalize="off" enterkeyhint="done">
    <div class="sugg" id="sugg" hidden></div>
  </div>
  <div id="banner"></div>
  <div id="view"></div>
  <div class="foot">가격은 찌라시 기준 세금 포함이에요. 실제 매장 가격과 다를 수 있어요.<br>100g·100ml당 가격은 용량이 적힌 상품만 계산해요.</div>
</main>

<div id="viewer" aria-hidden="true">
  <div class="vbar"><span class="vt" id="vt"></span><button id="vminus" aria-label="축소"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button><button id="vplus" aria-label="확대"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button><button id="vclose" aria-label="닫기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="vscroll"><img id="vimg" alt="찌라시"></div>
  <div class="vnav"><button id="vprev">◀ 이전 장</button><button id="vnext">다음 장 ▶</button></div>
</div>

<script>
const APP_VER='v14'; /* sw.js의 VERSION(pricecompare-vN)과 같이 올릴 것 */
document.getElementById('ver').textContent=APP_VER;
const FAV_KEY='pc.favs.v1', SHOP_KEY='pc.shop.v1';
let DATA=null, P={}, tab='store', favs=[], curShop=null;
const $=s=>document.querySelector(s);
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function dow(s){return ['일','월','화','수','목','금','토'][new Date(s+'T00:00:00').getDay()]}
function md(s){return Number(s.slice(5,7))+'/'+Number(s.slice(8,10))}
function koOf(key){return (P[key]&&P[key].ko)||key}
function labelHTML(key){
  const ko=koOf(key);
  const showJp=ko!==key&&/[^\x00-\x7f]/.test(key);
  return `<span class="ko">${esc(ko)}</span>${showJp?`<span class="jp">(${esc(key)})</span>`:''}`;
}
function norm(s){return String(s).normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\s+/g,'')}
function per(it){
  if(!it.price)return null;
  if(it.size&&it.unit)return {v:it.price/it.size*100,label:'/100'+it.unit};
  if(it.count)return {v:it.price/it.count,label:'/개',count:true};
  return null;
}
function validOn(it,t){return it.from<=t&&t<=it.to}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);const p=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
/* 이번 주 = 오늘부터 이번 주 일요일까지 (일요일이면 다음 주 일요일까지) */
function weekEnd(t){const w=new Date(t+'T00:00:00').getDay();return addDays(t,w===0?7:7-w)}
function inWeek(it,t){return it.from<=weekEnd(t)&&it.to>=t}
function weekLabel(t){const e=weekEnd(t);return `${md(t)}(${dow(t)}) ~ ${md(e)}(${dow(e)})`}
function periodLabel(it){
  if(it.from===it.to)return md(it.from)+'('+dow(it.from)+')만';
  return md(it.from)+'~'+md(it.to);
}
function storeOf(id){return DATA.stores.find(s=>s.id===id)}
function perTxt(x){
  if(!x.it.price)return '<span class="rper noprice">가격 표시 없음</span>';
  const p=x.p;
  if(!p)return '<span class="rper noprice">환산 불가</span>';
  return `<span class="rper">${p.count?`개당 ${yen(p.v)}`:`${p.v>=100?Math.round(p.v):p.v.toFixed(1)}円${p.label}`}</span>`;
}
function priceTxt(it){return it.price?yen(it.price):'—'}
function rowHTML(x,{best=false,withStore=false,label=null,tag=null,past=false}={}){
  const it=x.it,s=storeOf(it.store);
  const head=withStore?`<b>${esc(s.short)}</b> `:'';
  const lab=label?`<b>${esc(label)}</b> `:'';
  return `<div class="row${best?' best-row':''}${past?' past':''}"><div class="rname">${head}${tag||''}${lab}${esc(it.name)}</div><div class="rprice">${priceTxt(it)}</div><div class="rnote">${esc(it.note||'')}</div>${perTxt(x)}</div>`;
}
/* ---------- 가게별 ---------- */
function renderStore(){
  const t=todayStr();
  const chips=DATA.stores.map(s=>{
    const n=DATA.items.filter(it=>it.store===s.id).length;
    const nt=DATA.items.filter(it=>it.store===s.id&&inWeek(it,t)).length;
    return `<button class="schip${s.id===curShop?' on':''}" data-shop="${s.id}"><span class="n">${esc(s.name)}</span><span class="c">전체 ${n}건 · 이번 주 ${nt}건</span></button>`;
  }).join('');
  const s=storeOf(curShop);
  const all=DATA.items.filter(it=>it.store===s.id);
  const we=weekEnd(t);
  const today=all.filter(it=>validOn(it,t));
  const later=all.filter(it=>it.from>t&&it.from<=we);
  const future=all.filter(it=>it.from>we);
  const past=all.filter(it=>it.to<t);
  const lf=s.leaflets.map((l,i)=>`<button class="lf" data-lf="${i}"><img loading="lazy" src="${esc(l.img)}" alt="${esc(l.title)}"><div class="t"><b>${esc(l.title)}</b><span>${esc(l.period)}</span></div></button>`).join('');
  const byDate=(a,b)=>a.from.localeCompare(b.from)||a.to.localeCompare(b.to);
  const sortBy=arr=>arr.slice().sort(byDate);
  const list=(arr,opt)=>arr.map(it=>rowHTML({it,p:per(it)},{...opt,tag:`<span class="tag${opt&&opt.today?' today':''}">${periodLabel(it)}</span>`})).join('');
  let h=`<div class="schips">${chips}</div>`;
  h+=`<div class="shop-head"><h2>${esc(s.name)}</h2><div class="meta">${esc(s.src)} · <a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--accent)">원본 사이트</a></div></div>`;
  h+=`<div class="sec-title">찌라시 (${s.leaflets.length}장) — 탭하면 크게 볼 수 있어요</div><div class="leaflets">${lf}</div>`;
  h+=`<div class="sec-title">찌라시에 적힌 상품 전체 (${all.length}건)</div>`;
  const inW=today.length+later.length;
  h+=`<div class="week-box">이번 주 특가 <b>${weekLabel(t)}</b> · ${inW}건</div>`;
  if(today.length)h+=`<div class="group-title">오늘부터 (${md(t)} ${dow(t)}) 진행 중<span>${today.length}건</span></div><div class="rows">${list(sortBy(today),{today:true})}</div>`;
  const days=[...new Set(later.map(it=>it.from))].sort();
  for(const d of days){const arr=later.filter(it=>it.from===d);h+=`<div class="group-title">${md(d)} (${dow(d)}) 시작<span>${arr.length}건</span></div><div class="rows">${list(sortBy(arr))}</div>`}
  if(!inW)h+=`<div class="empty">이번 주에 유효한 상품이 없어요. 새 찌라시가 올라오면 업데이트해요.</div>`;
  if(future.length)h+=`<div class="group-title">다음 주 이후 시작<span>${future.length}건</span></div><div class="rows">${list(sortBy(future))}</div>`;
  if(past.length)h+=`<div class="group-title">이미 끝남<span>${past.length}건</span></div><div class="rows">${list(sortBy(past),{past:true})}</div>`;
  $('#view').innerHTML=h;
}
/* ---------- 즐겨찾기 ---------- */
function keysOf(it){return [it.key,...(it.alt||[])].filter(Boolean)}
function groups(items){const m=new Map();for(const it of items){for(const k of keysOf(it)){if(!m.has(k))m.set(k,[]);m.get(k).push(it)}}return m}
function rank(list){
  const g=list.map(it=>({it,p:per(it)}));
  const w=x=>!x.p?2:(x.p.count?1:0);
  g.sort((a,b)=>w(a)-w(b)||(a.p&&b.p?a.p.v-b.p.v:(a.it.price||1e9)-(b.it.price||1e9)));
  return g;
}
function groupCard(key,list,onlyStore){
  const isFav=favs.includes(key);
  const star=`<button class="star${isFav?' on':''}" data-star="${esc(key)}" aria-label="즐겨찾기">${isFav?'★':'☆'}</button>`;
  if(!list||!list.length)return `<div class="card"><div class="ghead"><div class="gname">${star}<span>${labelHTML(key)}</span></div><span class="fav-tag">이번 주 특가 없음</span></div></div>`;
  const ptag=it=>`<span class="tag${validOn(it,todayStr())?' today':''}">${periodLabel(it)}</span>`;
  if(onlyStore){
    const rs=rank(list).map(x=>x);
    return `<div class="card"><div class="ghead"><div class="gname">${star}<span>${labelHTML(key)}</span></div><span class="best nb">${rs.length}건</span></div><div class="rows">${rs.map(x=>rowHTML(x,{tag:ptag(x.it)})).join('')}</div></div>`;
  }
  const r=rank(list),top=r[0];
  const cls=x=>x.p?(x.p.count?'n':x.p.label):'x';
  const canCompare=r.filter(x=>cls(x)===cls(top)&&cls(x)!=='x').length>=2;
  const bestLabel=canCompare?`최저 ${storeOf(top.it.store).short}`:(new Set(r.map(x=>x.it.store)).size===1?`${storeOf(top.it.store).short}만 특가`:'직접 비교 불가');
  const rows=r.map((x,i)=>rowHTML(x,{best:canCompare&&i===0,withStore:true,tag:ptag(x.it)})).join('');
  return `<div class="card"><div class="ghead"><div class="gname">${star}<span>${labelHTML(key)}</span></div><span class="best${canCompare?'':' nb'}">${bestLabel}</span></div><div class="rows">${rows}</div></div>`;
}
const FAVSTORE_KEY='pc.favstore.v1';
const FAV_STORE_ORDER=[['life','라이프'],['gyomu','업무'],['santoku','산토쿠'],['york','요코']];
let favStore='all';
function renderFav(){
  const t=todayStr();
  const today=DATA.items.filter(it=>inWeek(it,t));
  const g=groups(today);
  const cnt=id=>favs.filter(k=>(g.get(k)||[]).some(it=>it.store===id)).length;
  $('#fchips').innerHTML=`<button class="fchip${favStore==='all'?' on':''}" data-fs="all">전체</button>`+FAV_STORE_ORDER.map(([id,nm])=>`<button class="fchip${favStore===id?' on':''}" data-fs="${id}">${nm}<span class="c">${cnt(id)}</span></button>`).join('');
  let h='';
  if(!favs.length)h+=`<div class="empty">즐겨찾기가 비어 있어요.<br>위 검색창에서 품목을 찾아 추가해 보세요.</div>`;
  if(favStore==='all'){
    for(const k of favs)h+=groupCard(k,g.get(k));
  }else{
    const nm=(FAV_STORE_ORDER.find(x=>x[0]===favStore)||[,''])[1];
    const has=[],none=[];
    for(const k of favs){const l=(g.get(k)||[]).filter(it=>it.store===favStore);(l.length?has:none).push([k,l])}
    if(favs.length)h+=`<div class="fnote">${esc(nm)}에서 이번 주 즐겨찾기 ${favs.length}개 중 <b>${has.length}개</b>가 특가예요.</div>`;
    for(const [k,l] of has)h+=groupCard(k,l,true);
    if(none.length)h+=`<div class="fnote">${esc(nm)}에는 이번 주 없어요: ${none.map(([k])=>labelHTML(k)).join(', ')}</div>`;
  }
  if(favs.length)h=`<div class="week-box">이번 주 특가 <b>${weekLabel(t)}</b> 기준</div>`+h;
  $('#view').innerHTML=h;
}
function render(){
  $('#search').style.display=tab==='fav'?'':'none';
  $('#fchips').style.display=tab==='fav'?'':'none';
  if(tab==='store')renderStore();else renderFav();
}
/* ---------- 검색(자동완성) ---------- */
function allKeys(){const set=new Set(Object.keys(P));for(const it of DATA.items)for(const k of keysOf(it))set.add(k);return [...set]}
function dealCount(key,t){return DATA.items.filter(it=>keysOf(it).includes(key)&&inWeek(it,t)).length}
function suggest(q){
  const nq=norm(q);if(!nq)return [];
  const t=todayStr(),out=[];
  for(const key of allKeys()){
    if(favs.includes(key))continue;
    const names=[koOf(key),key,...((P[key]&&P[key].alias)||[])].map(norm);
    let sc=null;
    if(names[0].startsWith(nq))sc=0;else if(names.some(n=>n.startsWith(nq)))sc=1;else if(names[0].includes(nq))sc=2;else if(names.some(n=>n.includes(nq)))sc=3;
    if(sc===null||(nq.length<2&&sc>1))continue;
    out.push({key,sc,deal:dealCount(key,t)});
  }
  out.sort((a,b)=>a.sc-b.sc||(b.deal>0)-(a.deal>0)||koOf(a.key).localeCompare(koOf(b.key),'ko'));
  return out.slice(0,8);
}
let hlIdx=-1,curSugg=[];
function showSugg(){
  const q=$('#addi').value,box=$('#sugg');
  if(!q.trim()){box.hidden=true;curSugg=[];return}
  curSugg=suggest(q);hlIdx=-1;
  if(!curSugg.length){box.innerHTML='<div class="noresult">찾는 품목이 없어요. 다른 말로 검색해 보세요.</div>';box.hidden=false;return}
  box.innerHTML=curSugg.map(s=>`<button type="button" data-pick="${esc(s.key)}"><span>${labelHTML(s.key)}</span>${s.deal?`<span class="deal">이번 주 ${s.deal}건 특가</span>`:'<span class="nodeal">이번 주 특가 없음</span>'}</button>`).join('');
  box.hidden=false;
}
function pick(key){
  if(key&&!favs.includes(key)){favs.push(key);lsSet(FAV_KEY,favs)}
  $('#addi').value='';$('#sugg').hidden=true;curSugg=[];render();
}
/* ---------- 찌라시 뷰어 ---------- */
let vList=[],vIdx=0,vZoom=1;
function openViewer(list,i){vList=list;vIdx=i;vZoom=1;$('#viewer').classList.add('on');$('#viewer').setAttribute('aria-hidden','false');showV()}
function showV(){
  const l=vList[vIdx];
  $('#vt').textContent=`${l.title} (${vIdx+1}/${vList.length})`;
  const im=$('#vimg');im.src=l.img;applyZoom();
  $('#vscroll').scrollTo(0,0);
  $('#vprev').disabled=vIdx===0;$('#vnext').disabled=vIdx===vList.length-1;
}
function applyZoom(){$('#vimg').style.width=(vZoom*100)+'%'}
function closeViewer(){$('#viewer').classList.remove('on');$('#viewer').setAttribute('aria-hidden','true')}
$('#vclose').onclick=closeViewer;
$('#vplus').onclick=()=>{vZoom=Math.min(4,vZoom+0.5);applyZoom()};
$('#vminus').onclick=()=>{vZoom=Math.max(1,vZoom-0.5);applyZoom()};
$('#vprev').onclick=()=>{if(vIdx>0){vIdx--;vZoom=1;showV()}};
$('#vnext').onclick=()=>{if(vIdx<vList.length-1){vIdx++;vZoom=1;showV()}};
$('#vimg').addEventListener('dblclick',()=>{vZoom=vZoom>1?1:2.5;applyZoom()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});
/* iOS: 버튼을 빠르게 두 번 누르면 화면이 확대되는 것 막기 */
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTouchEnd<350&&e.target.closest('button')){e.preventDefault();e.target.closest('button').click()}
  lastTouchEnd=now;
},{passive:false});/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tab');
  if(tb){tab=tb.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===tb));$('#sugg').hidden=true;render();window.scrollTo(0,0);return}
  const fs=e.target.closest('[data-fs]');
  if(fs){favStore=fs.dataset.fs;lsSet(FAVSTORE_KEY,favStore);render();return}
  const sc=e.target.closest('[data-shop]');
  if(sc){curShop=sc.dataset.shop;lsSet(SHOP_KEY,curShop);render();return}
  const lf=e.target.closest('[data-lf]');
  if(lf){const s=storeOf(curShop);openViewer(s.leaflets,Number(lf.dataset.lf));return}
  const st=e.target.closest('[data-star]');
  if(st){const k=st.dataset.star;favs=favs.includes(k)?favs.filter(x=>x!==k):[...favs,k];lsSet(FAV_KEY,favs);render();return}
  const pk=e.target.closest('[data-pick]');
  if(pk){pick(pk.dataset.pick);return}
  if(!e.target.closest('#search'))$('#sugg').hidden=true;
});
$('#addi').addEventListener('input',showSugg);
$('#addi').addEventListener('focus',showSugg);
$('#addi').addEventListener('keydown',e=>{
  const items=[...document.querySelectorAll('#sugg [data-pick]')];
  if(e.key==='ArrowDown'&&items.length){e.preventDefault();hlIdx=(hlIdx+1)%items.length}
  else if(e.key==='ArrowUp'&&items.length){e.preventDefault();hlIdx=(hlIdx-1+items.length)%items.length}
  else if(e.key==='Enter'){e.preventDefault();const s=curSugg[hlIdx>=0?hlIdx:0];if(s)pick(s.key);return}
  else if(e.key==='Escape'){$('#sugg').hidden=true;return}
  else return;
  items.forEach((b,i)=>b.classList.toggle('hl',i===hlIdx));
});
async function init(){
  const t=todayStr();
  $('#today').textContent=`${md(t)} (${dow(t)})`;
  try{
    DATA=await (await fetch('data/prices.json?'+Date.now(),{cache:'no-store'})).json();
    try{P=await (await fetch('data/products.json?'+Date.now(),{cache:'no-store'})).json()}catch(e){P={}}
  }catch(e){$('#view').innerHTML='<div class="empty">데이터를 불러오지 못했어요.<br>인터넷 연결을 확인해 주세요.</div>';return}
  $('#sub').textContent=`업데이트 ${DATA.updatedAt} · 세금 포함 · 100g당 환산`;
  const saved=lsGet(FAV_KEY);
  if(Array.isArray(saved)){const ks=allKeys();favs=saved.filter(k=>ks.includes(k))}
  else{favs=['卵','鶏もも肉','サーモン'];lsSet(FAV_KEY,favs)}
  const fsv=lsGet(FAVSTORE_KEY);
  favStore=(fsv==='all'||FAV_STORE_ORDER.some(x=>x[0]===fsv))?fsv:'all';
  const sh=lsGet(SHOP_KEY);
  curShop=DATA.stores.some(s=>s.id===sh)?sh:DATA.stores[0].id;
  const stale=DATA.updated<t;
  $('#banner').innerHTML=stale?`<div class="banner">오늘(${md(t)}) 데이터는 아직 없어요. 마지막 업데이트는 ${md(DATA.updated)}이고, 기간이 남은 상품만 “오늘”로 보여줘요.</div>`:'';
  render();
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
init();
</script>
</body>
