<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="오늘 최저가">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>오늘 최저가</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1d2320;--sub:#5d6761;--mute:#98a29c;--line:#e3e6e1;--green:#2f7d4f;--greenbg:#e6f3ea;--amber:#b8791a;--amberbg:#fdf2dc;--red:#b3402f;--accent:#2f7d4f}
@media(prefers-color-scheme:dark){:root{--bg:#141815;--card:#1d2420;--ink:#eef2ee;--sub:#a8b2ab;--mute:#6f7a73;--line:#2b342f;--green:#6fcf97;--greenbg:#1d3326;--amber:#e0a94a;--amberbg:#352b17;--red:#ee8a7a;--accent:#6fcf97}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans KR","Noto Sans JP","Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px 14px 0}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:20px;margin:0;font-weight:700}
.date{font-size:14px;color:var(--sub)}
.sub{font-size:12px;color:var(--mute);margin:3px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tab{font-size:14px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--sub);white-space:nowrap;cursor:pointer;font-family:inherit}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media(prefers-color-scheme:dark){.tab.on{color:#10201a}}
.banner{background:var(--amberbg);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gname{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
.star{background:none;border:0;font-size:22px;line-height:1;padding:2px 4px;cursor:pointer;color:var(--mute);font-family:inherit}
.star.on{color:#e5a812}
.best{font-size:12px;font-weight:700;color:var(--green);background:var(--greenbg);padding:3px 9px;border-radius:99px;white-space:nowrap}
.best.nb{color:var(--mute);background:var(--bg);font-weight:500}
.rows{margin-top:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.row:first-child{border-top:0}
.rname{color:var(--sub);line-height:1.35}
.rname b{color:var(--ink);font-weight:600}
.rnote{font-size:11px;color:var(--mute);grid-column:1/2}
.rprice{text-align:right;font-size:14px;font-weight:600;white-space:nowrap}
.rper{font-size:12px;color:var(--sub);text-align:right;white-space:nowrap}
.row.best-row .rper{color:var(--green);font-weight:700}
.row.best-row .rprice{color:var(--green)}
.none{font-size:13px;color:var(--mute);margin-top:6px}
.empty{text-align:center;color:var(--sub);padding:34px 10px;font-size:14px;line-height:1.7}
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap input{width:100%;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;outline:none}
.searchwrap input:focus{border-color:var(--accent)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:10;overflow:hidden}
.sugg button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;font-size:15px;color:var(--ink);font-family:inherit;cursor:pointer}
.sugg button:first-child{border-top:0}
.sugg button:active,.sugg button.hl{background:var(--greenbg)}
.sugg .deal{font-size:12px;color:var(--green);font-weight:600;white-space:nowrap}
.sugg .nodeal{font-size:12px;color:var(--mute);white-space:nowrap}
.sugg .noresult{padding:12px 14px;font-size:13px;color:var(--mute)}
.ko{font-weight:700}
.jp{font-weight:400;color:var(--sub);font-size:.82em;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer;font-family:inherit}
.store{padding:0}
.shead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:14px;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left}
.shead .sname{flex:1;font-size:16px;font-weight:700}
.shead .scount{font-size:13px;color:var(--sub)}
.shead .chev{font-size:11px;color:var(--mute)}
.store .meta,.store .rows{margin-left:14px;margin-right:14px}
.store .rows{margin-bottom:10px}
.store .meta{font-size:12px;color:var(--mute);margin-top:-4px;margin-bottom:2px}
.store a{color:var(--accent);text-decoration:none;font-size:12px}
.foot{font-size:11px;color:var(--mute);text-align:center;margin-top:18px;line-height:1.6}
.fav-tag{font-size:11px;color:var(--mute);margin-left:2px}
</style>
</head>
<body>
<main>
  <header><h1>오늘의 최저가</h1><span class="date" id="today"></span></header>
  <div class="sub" id="sub"></div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-t="fav">즐겨찾기</button>
    <button class="tab" data-t="all">전체 특가</button>
    <button class="tab" data-t="store">가게별</button>
  </div>
  <div class="searchwrap" id="search">
    <input id="addi" type="search" placeholder="품목 검색 (예: 우유, 닭다리살)" autocomplete="off" autocapitalize="off" enterkeyhint="done">
    <div class="sugg" id="sugg" hidden></div>
  </div>
  <div id="banner"></div>
  <div id="view"></div>
  <div class="foot">가격은 찌라시 기준 세금 포함이에요. 실제 매장 가격과 다를 수 있어요.<br>100g·100ml당 가격은 용량이 적힌 상품만 계산해요.</div>
</main>
<script>
const FAV_KEY='pc.favs.v1';
let DATA=null, P={}, tab='fav', favs=[], openStores=new Set();
const $=s=>document.querySelector(s);
function koOf(key){return (P[key]&&P[key].ko)||key}
function labelHTML(key){
  const ko=koOf(key);
  const showJp=ko!==key&&/[^\x00-\x7f]/.test(key);
  return `<span class="ko">${esc(ko)}</span>${showJp?`<span class="jp">(${esc(key)})</span>`:''}`;
}
function norm(s){
  return String(s).normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\s+/g,'');
}
function allKeys(){
  const set=new Set(Object.keys(P));
  for(const it of DATA.items)set.add(it.key);
  return [...set];
}
function dealCount(key,t){return DATA.items.filter(it=>it.key===key&&validToday(it,t)).length}
function suggest(q){
  const nq=norm(q);
  if(!nq)return [];
  const t=todayStr(),out=[];
  for(const key of allKeys()){
    if(favs.includes(key))continue;
    const names=[koOf(key),key,...((P[key]&&P[key].alias)||[])].map(norm);
    let sc=null;
    if(names[0].startsWith(nq))sc=0;
    else if(names.some(n=>n.startsWith(nq)))sc=1;
    else if(names[0].includes(nq))sc=2;
    else if(names.some(n=>n.includes(nq)))sc=3;
    if(sc===null||(nq.length<2&&sc>1))continue;
    out.push({key,sc,deal:dealCount(key,t)});
  }
  out.sort((a,b)=>a.sc-b.sc||(b.deal>0)-(a.deal>0)||koOf(a.key).localeCompare(koOf(b.key),'ko'));
  return out.slice(0,8);
}
let hlIdx=-1,curSugg=[];
function showSugg(){
  const q=$('#addi').value;
  const box=$('#sugg');
  if(!q.trim()){box.hidden=true;curSugg=[];return}
  curSugg=suggest(q);hlIdx=-1;
  if(!curSugg.length){box.innerHTML='<div class="noresult">찾는 품목이 없어요. 다른 말로 검색해 보세요.</div>';box.hidden=false;return}
  box.innerHTML=curSugg.map((s,i)=>`<button type="button" data-pick="${esc(s.key)}"><span>${labelHTML(s.key)}</span>${s.deal?`<span class="deal">오늘 ${s.deal}건 특가</span>`:'<span class="nodeal">오늘 특가 없음</span>'}</button>`).join('');
  box.hidden=false;
}
function pick(key){
  if(key&&!favs.includes(key)){favs.push(key);save()}
  $('#addi').value='';$('#sugg').hidden=true;curSugg=[];
  render();
}
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
function load(){try{const v=JSON.parse(localStorage.getItem(FAV_KEY)||'null');if(Array.isArray(v))return v}catch(e){}return null}
function save(){try{localStorage.setItem(FAV_KEY,JSON.stringify(favs))}catch(e){}}
function todayStr(){const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function dow(s){return ['일','월','화','수','목','금','토'][new Date(s+'T00:00:00').getDay()]}
function per(it){
  if(it.size&&it.unit){return {v:it.price/it.size*100,label:'/100'+it.unit}}
  if(it.count){return {v:it.price/it.count,label:'/개',count:true}}
  return null;
}
function validToday(it,t){return it.from<=t&&t<=it.to}
function groups(items){
  const m=new Map();
  for(const it of items){if(!m.has(it.key))m.set(it.key,[]);m.get(it.key).push(it)}
  return m;
}
function rank(list){
  // 100g/100ml 환산 가능한 것끼리 먼저 정렬, 그다음 개당, 그다음 환산 불가
  const g=list.map(it=>({it,p:per(it)}));
  const w=x=>!x.p?2:(x.p.count?1:0);
  g.sort((a,b)=>w(a)-w(b)||(a.p&&b.p?a.p.v-b.p.v:a.it.price-b.it.price));
  return g;
}
function storeName(id){return DATA.stores.find(s=>s.id===id)}
function rowHTML(x,isBest){
  const it=x.it,p=x.p,s=storeName(it.store);
  const perTxt=p?(p.count?`개당 ${yen(p.v)}`:`${p.v>=100?Math.round(p.v):p.v.toFixed(1)}円${p.label}`):'환산 불가';
  return `<div class="row${isBest?' best-row':''}"><div class="rname"><b>${s.short}</b> ${esc(it.name)}</div><div class="rprice">${yen(it.price)}</div>${it.note?`<div class="rnote">${esc(it.note)}</div>`:'<div></div>'}<div class="rper">${perTxt}</div></div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function groupCard(key,list){
  const isFav=favs.includes(key);
  const star=`<button class="star${isFav?' on':''}" data-star="${esc(key)}" aria-label="즐겨찾기">${isFav?'★':'☆'}</button>`;
  if(!list||!list.length){
    return `<div class="card"><div class="ghead"><div class="gname">${star}<span>${labelHTML(key)}</span></div><span class="fav-tag">오늘 특가 없음</span></div></div>`;
  }
  const r=rank(list);
  const top=r[0];
  const cls=x=>x.p?(x.p.count?'n':x.p.label):'x';
  const same=r.filter(x=>cls(x)===cls(top)&&cls(x)!=='x').length;
  const canCompare=same>=2;
  const bestLabel=canCompare?`최저 ${storeName(top.it.store).short}`:(r.length===1?`${storeName(top.it.store).short}만 특가`:'직접 비교 불가');
  const rows=r.map((x,i)=>rowHTML(x,canCompare&&i===0)).join('');
  return `<div class="card"><div class="ghead"><div class="gname">${star}<span>${labelHTML(key)}</span></div><span class="best${canCompare?'':' nb'}">${bestLabel}</span></div><div class="rows">${rows}</div></div>`;
}
function render(){
  const t=todayStr();
  const todayItems=DATA.items.filter(it=>validToday(it,t));
  const g=groups(todayItems);
  const v=$('#view');
  let html='';
  if(tab==='fav'){
    if(!favs.length){
      html+=`<div class="empty">즐겨찾기가 비어 있어요.<br>위 검색창에서 품목을 찾거나, “전체 특가”에서 ☆를 눌러 보세요.</div>`;
    }
    for(const k of favs)html+=groupCard(k,g.get(k));
  }else if(tab==='all'){
    const keys=[...g.keys()].sort((a,b)=>g.get(b).length-g.get(a).length||koOf(a).localeCompare(koOf(b),'ko'));
    if(!keys.length)html+=`<div class="empty">오늘 유효한 특가 데이터가 없어요.</div>`;
    for(const k of keys)html+=groupCard(k,g.get(k));
  }else{
    for(const s of DATA.stores){
      const its=todayItems.filter(it=>it.store===s.id);
      const open=openStores.has(s.id);
      html+=`<div class="card store"><button class="shead" data-store="${s.id}" aria-expanded="${open}"><span class="sname">${esc(s.name)}</span><span class="scount">${its.length}건</span><span class="chev">${open?'▲':'▼'}</span></button>`;
      if(open){
        html+=`<div class="meta">${s.note?esc(s.note)+' · ':''}<a href="${s.url}" target="_blank" rel="noopener">찌라시 원본</a></div><div class="rows">`;
        if(!its.length)html+=`<div class="none">오늘 유효한 데이터가 없어요.</div>`;
        else for(const it of its.sort((a,b)=>koOf(a.key).localeCompare(koOf(b.key),'ko')))html+=rowHTML({it,p:per(it)},false).replace(/<b>[^<]*<\/b> /,`<b>${esc(koOf(it.key))}</b> `);
        html+=`</div>`;
      }
      html+=`</div>`;
    }
  }
  v.innerHTML=html;
}
function setBanner(){
  const t=todayStr();
  const b=$('#banner');
  const stale=DATA.updated<t;
  b.innerHTML=stale?`<div class="banner">오늘(${t.slice(5).replace('-','/')}) 데이터는 아직 없어요. 마지막 업데이트는 ${DATA.updated.slice(5).replace('-','/')}이고, 기간이 남은 특가만 보여줘요.</div>`:'';
}
async function init(){
  const t=todayStr();
  $('#today').textContent=`${t.slice(5).replace('-','/')} (${dow(t)})`;
  const saved=load();
  favs=saved||[];
  try{
    const r=await fetch('data/prices.json?'+Date.now(),{cache:'no-store'});
    DATA=await r.json();
    try{const r2=await fetch('data/products.json?'+Date.now(),{cache:'no-store'});P=await r2.json()}catch(e){P={}}
  }catch(e){
    $('#view').innerHTML='<div class="empty">데이터를 불러오지 못했어요.<br>인터넷 연결을 확인해 주세요.</div>';return;
  }
  $('#sub').textContent=`업데이트 ${DATA.updatedAt} · 세금 포함 · 100g당 환산`;
  if(!saved){favs=['卵','鶏もも肉','サーモン'];save()}
  else{const ks=allKeys();const f=favs.filter(k=>ks.includes(k));if(f.length!==favs.length){favs=f;save()}}
  setBanner();render();
}
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tab');
  if(tb){tab=tb.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===tb));$('#search').style.display=tab==='fav'?'':'none';$('#sugg').hidden=true;render();return}
  const st=e.target.closest('[data-star]');
  if(st){const k=st.dataset.star;favs=favs.includes(k)?favs.filter(x=>x!==k):[...favs,k];save();render();return}
  const sh=e.target.closest('[data-store]');
  if(sh){const id=sh.dataset.store;openStores.has(id)?openStores.delete(id):openStores.add(id);render();return}
  const pk=e.target.closest('[data-pick]');
  if(pk){pick(pk.dataset.pick);return}
  if(!e.target.closest('#search'))$('#sugg').hidden=true;
});
$('#addi').addEventListener('input',showSugg);
$('#addi').addEventListener('focus',showSugg);
$('#addi').addEventListener('keydown',e=>{
  const items=[...document.querySelectorAll('#sugg [data-pick]')];
  if(e.key==='ArrowDown'&&items.length){e.preventDefault();hlIdx=(hlIdx+1)%items.length}
  else if(e.key==='ArrowUp'&&items.length){e.preventDefault();hlIdx=(hlIdx-1+items.length)%items.length}
  else if(e.key==='Enter'){e.preventDefault();const s=curSugg[hlIdx>=0?hlIdx:0];if(s)pick(s.key);return}
  else if(e.key==='Escape'){$('#sugg').hidden=true;return}
  else return;
  items.forEach((b,i)=>b.classList.toggle('hl',i===hlIdx));
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
init();
</script>
</body>
</html>
